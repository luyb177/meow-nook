<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f6f8fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 18px 24px;
            font-size: 20px;
            font-weight: 600;
        }

        .section {
            padding: 20px 24px;
        }

        .row {
            margin-bottom: 10px;
        }

        .label {
            color: #6b7280;
            font-size: 13px;
        }

        .value {
            font-weight: 600;
            color: #111827;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }

        .code-block {
            background: #0f172a;
            color: #e2e8f0;
            padding: 14px;
            border-radius: 8px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            padding: 12px 0 18px;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
        🚨 DLQ Alert - {{.ServiceName}}
    </div>

    <div class="section">
        <div class="row">
            <div class="label">Task ID</div>
            <div class="value">{{.TaskID}}</div>
        </div>

        <div class="row">
            <div class="label">Retry</div>
            <div class="value">{{.Retry}} / {{.MaxRetry}}</div>
        </div>

        <div class="row">
            <div class="label">Stage</div>
            <div class="value">{{.Stage}}</div>
        </div>

        <div class="row">
            <div class="label">Reason</div>
            <div class="value">{{.Reason}}</div>
        </div>

        <div class="row">
            <div class="label">Error</div>
            <div class="value">{{.Error}}</div>
        </div>

        <div class="divider"></div>

        <div class="row">
            <div class="label">Created At</div>
            <div class="value">{{.CreatedAt}}</div>
        </div>

        <div class="row">
            <div class="label">Next Run At</div>
            <div class="value">{{.NextRunAt}}</div>
        </div>

        <div class="divider"></div>

        <div class="label" style="margin-bottom:8px;">Payload (truncated)</div>
        <div class="code-block">{{.Data}}</div>
    </div>

    <div class="footer">
        This is an automated message from DLQ Monitor
    </div>
</div>
</body>
</html>
