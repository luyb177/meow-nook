services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meow_nook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-rpc:
        condition: service_started
      cat-rpc:
        condition: service_started
      task-rpc:
        condition: service_started
      adoption-rpc:
        condition: service_started
      post-rpc:
        condition: service_started
    environment:
      - TZ=Asia/Shanghai

  user-rpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.user
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cat-rpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cat
    ports:
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy

  task-rpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.task
    ports:
      - "9003:9003"
    depends_on:
      postgres:
        condition: service_healthy

  adoption-rpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.adoption
    ports:
      - "9004:9004"
    depends_on:
      postgres:
        condition: service_healthy

  post-rpc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.post
    ports:
      - "9005:9005"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
