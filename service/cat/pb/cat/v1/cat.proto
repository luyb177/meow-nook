syntax = "proto3";

package cat;

option go_package = "./pb/cat/v1";

import "google/protobuf/timestamp.proto";


service CatService {
    // 志愿者
    rpc ApplyCreateCat(ApplyCreateCatRequest) returns (ApplyCreateCatResponse);
    rpc CancelApplyCreateCat(CancelApplyCreateCatRequest) returns (Response);
    rpc GetApplyDetail(GetApplyDetailRequest) returns (GetApplyDetailResponse);
    rpc ListMyApplies(ListMyAppliesRequest) returns (ListMyAppliesResponse);

    // 管理员
    rpc ApproveCreateCat(ApproveCreateCatRequest) returns (ApproveCreateCatResponse);
    rpc RejectCreateCat(RejectCreateCatRequest) returns (Response);
    rpc DirectCreateCat(DirectCreateCatRequest) returns (DirectCreateCatResponse);
    rpc ListPendingApplies(ListPendingAppliesRequest) returns (ListPendingAppliesResponse);


    // ==================== 志愿者端 ====================

    // 申请领养
        rpc ApplyAdopt(ApplyAdoptRequest) returns (ApplyAdoptResponse);

    // 取消申请
        rpc CancelAdoptApply(CancelAdoptApplyRequest) returns (CancelAdoptApplyResponse);

    // 查看申请详情
        rpc GetAdoptApplyDetail(GetAdoptApplyDetailRequest) returns (GetAdoptApplyDetailResponse);

    // 我的申请列表
        rpc ListMyAdoptApplies(ListMyAdoptAppliesRequest) returns (ListMyAdoptAppliesResponse);

    // 我的领养记录
        rpc ListMyAdoptions(ListMyAdoptionsRequest) returns (ListAdoptionsResponse);

    // 完成回访
        rpc CompleteVisit(RecordFollowUpVisitRequest) returns (RecordFollowUpVisitResponse);

    // ==================== 管理员端 ====================

    // 审核通过
        rpc ApproveAdopt(ApproveAdoptRequest) returns (ApproveAdoptResponse);

    // 审核拒绝
        rpc RejectAdopt(RejectAdoptRequest) returns (RejectAdoptResponse);

    // 待审核列表
        rpc ListPendingAdoptApplies(ListPendingAdoptAppliesRequest) returns (ListPendingAdoptAppliesResponse);

    // 从申请创建领养记录
        rpc CreateAdoption(CreateAdoptionRequest) returns (CreateAdoptionResponse);

    // 直接领养
        rpc DirectAdopt(DirectAdoptRequest) returns (DirectAdoptResponse);

    // 查看领养详情
        rpc GetAdoptionDetail(GetAdoptionDetailRequest) returns (GetAdoptionDetailResponse);

    // 领养记录列表
        rpc ListAdoptions(ListAdoptionsRequest) returns (ListAdoptionsResponse);

    // 更新领养信息
        rpc UpdateAdoption(UpdateAdoptionRequest) returns (UpdateAdoptionResponse);

    // 记录家访
        rpc RecordHomeVisit(RecordHomeVisitRequest) returns (RecordHomeVisitResponse);

    // 记录回访
        rpc RecordFollowUpVisit(RecordFollowUpVisitRequest) returns (RecordFollowUpVisitResponse);

    // 更新退回状态
        rpc UpdateReturnStatus(UpdateReturnStatusRequest) returns (UpdateReturnStatusResponse);



    // 申请修改猫咪档案信息
    rpc ApplyUpdateCatInfo(ApplyUpdateCatInfoRequest) returns (ApplyUpdateCatInfoResponse);

    // 查看自己提交的修改申请详情
    rpc GetMyUpdateCatApplyDetail(GetMyUpdateCatApplyDetailRequest) returns (GetMyUpdateCatApplyDetailResponse);


    // ---------- 医疗记录 ----------

    // 申请新增医疗记录
    rpc ApplyAddMedicalRecord(ApplyAddMedicalRecordRequest)
        returns (ApplyAddMedicalRecordResponse);


    // ---------- 救助记录 ----------

    // 申请新增救助记录
    rpc ApplyAddRescueRecord(ApplyAddRescueRecordRequest)
        returns (ApplyAddRescueRecordResponse);


    // ---------- 猫咪任务 ----------

    // 申请创建任务
    rpc ApplyCreateCatTask(ApplyCreateCatTaskRequest)
        returns (ApplyCreateCatTaskResponse);

    // 取消申请创建任务
    rpc CancelApplyCreateCatTask(CancelApplyCreateCatTaskRequest)
        returns (Response);

    // 获取自己的任务申请详情
    rpc GetMyTaskApplyDetail(GetMyTaskApplyDetailRequest)
        returns (GetMyTaskApplyDetailResponse);

    // 我的任务申请列表
    rpc ListMyTaskApplies(ListMyTaskAppliesRequest)
        returns (ListMyTaskAppliesResponse);

    // 申请认领任务
    rpc ClaimCatTask(ClaimCatTaskRequest)
        returns (ClaimCatTaskResponse);

    // 申请放弃任务
    rpc AbandonCatTask(AbandonCatTaskRequest)
        returns (AbandonCatTaskResponse);

    // 完成任务
    rpc CompleteCatTask(CompleteCatTaskRequest)
        returns (CompleteCatTaskResponse);

    // 上传任务进度（图片/备注）
    rpc UploadTaskProgress(UploadTaskProgressRequest)
        returns (UploadTaskProgressResponse);

    // 获取我认领的任务列表
    rpc ListMyClaimedTasks(ListMyClaimedTasksRequest)
        returns (ListMyClaimedTasksResponse);

    // 获取任务详情
    rpc GetCatTaskDetail(GetCatTaskDetailRequest)
        returns (GetCatTaskDetailResponse);


    /*
     * =========================================================
     * 管理员侧接口（Admin）
     * =========================================================
     */

    // ---------- 修改猫咪档案审核 ----------

    rpc ApproveUpdateCatInfo(ApproveUpdateCatInfoRequest)
        returns (ApproveUpdateCatInfoResponse);

    rpc RejectUpdateCatInfo(RejectUpdateCatInfoRequest)
        returns (RejectUpdateCatInfoResponse);

    rpc GetUpdateCatApplyDetail(GetUpdateCatApplyDetailRequest)
        returns (GetUpdateCatApplyDetailResponse);

    rpc ListUpdateCatApply(ListUpdateCatApplyRequest)
        returns (ListUpdateCatApplyResponse);


    // ---------- 医疗记录审核 ----------

    rpc ApproveMedicalRecord(ApproveMedicalRecordRequest)
        returns (ApproveMedicalRecordResponse);

    rpc RejectMedicalRecord(RejectMedicalRecordRequest)
        returns (RejectMedicalRecordResponse);


    // ---------- 任务审核 ----------

    // 管理员审核志愿者任务申请
    rpc ApproveCreateCatTask(ApproveCreateCatTaskRequest)
        returns (ApproveCreateCatTaskResponse);

    rpc RejectCreateCatTask(RejectCreateCatTaskRequest)
        returns (RejectCreateCatTaskResponse);

    rpc GetCreateCatTaskApplyDetail(GetCreateCatTaskApplyDetailRequest)
        returns (GetCreateCatTaskApplyDetailResponse);

    rpc ListCreateCatTaskApply(ListCreateCatTaskApplyRequest)
        returns (ListCreateCatTaskApplyResponse);

    // 管理员直接创建正式任务（无需审核）
    rpc CreateCatTask(CreateCatTaskRequest)
        returns (CreateCatTaskResponse);

    // 管理员更新任务状态
    rpc UpdateCatTaskStatus(UpdateCatTaskStatusRequest)
        returns (UpdateCatTaskStatusResponse);

    /*
     * =========================================================
     * 公共查询接口（所有人可访问）
     * =========================================================
     */

    // 猫咪详情
    rpc GetCatDetail(GetCatDetailRequest)
        returns (GetCatDetailResponse);

    // 猫咪列表
    rpc ListCats(ListCatsRequest)
        returns (ListCatsResponse);

    // 正式任务列表
    rpc ListCatTasks(ListCatTasksRequest)
        returns (ListCatTasksResponse);
}

// ==================== 通用响应 ====================

message Response {}

// ==================== 图片项 ====================

message ImageItem {
    string url = 1;
    string description = 2;
    int32 sort = 3;
    bool is_cover = 4;
}

// ==================== 志愿者：申请创建猫咪档案 ====================

message ApplyCreateCatRequest {
    // 基础信息
    string name = 1;
    string gender = 2;
    string body_size = 3;
    string age_stage = 4;
    string description = 5;

    // 位置信息
    string discovery_address = 6;
    double longitude = 7;
    double latitude = 8;

    // 图片（URL列表，已上传到OSS）
    repeated ImageItem images = 9;

    // 标签ID列表
    repeated uint64 tag_ids = 10;

    // 申请人ID（从网关JWT解析传入）
    uint64 applicant_user_id = 11;
}

message ApplyCreateCatResponse {
    uint64 apply_id = 1;
    google.protobuf.Timestamp created_at = 2;
}

// ==================== 志愿者：取消申请 ====================

message CancelApplyCreateCatRequest {
    uint64 apply_id = 1;
    uint64 applicant_user_id = 2;
    string reason = 3;
}

// ==================== 管理员：审核通过 ====================

message ApproveCreateCatRequest {
    uint64 apply_id = 1;
    uint64 operator_id = 2;

    // 审核时补充的正式档案信息
    string cat_code = 3;
    string breed = 4;
    string color = 5;
    bool is_vaccinated = 6;
    bool is_healthy = 7;
    bool need_medical_intervention = 8;
    string sterilization_status = 9;

    // 追加标签ID（审核时可以额外补充标签）
    repeated uint64 extra_tag_ids = 10;
}

message ApproveCreateCatResponse {
    uint64 cat_id = 1;
    string cat_code = 2;
    string status = 3;
}

// ==================== 管理员：驳回 ====================

message RejectCreateCatRequest {
    uint64 apply_id = 1;
    string reason = 2;
    uint64 operator_id = 3;
}

// ==================== 管理员：直接创建猫咪档案 ====================

message DirectCreateCatRequest {
    string cat_code = 1;
    string name = 2;
    string breed = 3;
    string color = 4;
    string gender = 5;
    string body_size = 6;
    string age_stage = 7;
    string description = 8;

    string discovery_address = 9;
    double longitude = 10;
    double latitude = 11;

    bool is_vaccinated = 12;
    bool is_healthy = 13;
    bool need_medical_intervention = 14;
    string sterilization_status = 15;

    repeated ImageItem images = 16;
    repeated uint64 tag_ids = 17;

    uint64 operator_id = 18;
}

message DirectCreateCatResponse {
    uint64 cat_id = 1;
    string cat_code = 2;
}

// ==================== 查询：申请详情 ====================

message GetApplyDetailRequest {
    uint64 apply_id = 1;
}

message GetApplyDetailResponse {
    uint64 apply_id = 1;
    uint64 cat_id = 2;
    string name = 3;
    string gender = 4;
    string body_size = 5;
    string age_stage = 6;
    string description = 7;
    string discovery_address = 8;
    double longitude = 9;
    double latitude = 10;
    uint64 applicant_user_id = 11;
    string status = 12;
    string reject_reason = 13;
    string cancel_reason = 14;
    uint64 reviewer_id = 15;

    repeated ImageItem images = 16;

    google.protobuf.Timestamp created_at = 17;
    google.protobuf.Timestamp updated_at = 18;
}

// ==================== 查询：我的申请列表 ====================

message ListMyAppliesRequest {
    uint64 applicant_user_id = 1;
    string status = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message ListMyAppliesResponse {
    message ApplyItem {
        uint64 apply_id = 1;
        string name = 2;
        string status = 3;
        uint64 cat_id = 4;
        google.protobuf.Timestamp created_at = 5;
    }

    repeated ApplyItem list = 1;
    int64 total = 2;
}

// ==================== 查询：待审核列表 ====================

message ListPendingAppliesRequest {
    string keyword = 1;
    int32 page = 2;
    int32 page_size = 3;
}

message ListPendingAppliesResponse {
    message ApplyItem {
        uint64 apply_id = 1;
        string name = 2;
        string gender = 3;
        string age_stage = 4;
        string discovery_address = 5;
        uint64 applicant_user_id = 6;
        google.protobuf.Timestamp created_at = 7;
    }

    repeated ApplyItem list = 1;
    int64 total = 2;
}

// ==================== 领养申请表相关 ====================

message ApplyAdoptRequest {
    uint64 cat_id = 1;                    // 猫咪ID
    string apply_reason = 2;              // 申请理由
    string contact_phone = 3;             // 联系电话
    string contact_wechat = 4;            // 微信号

    uint64 applicant_id = 5;              // 申请人ID，由HTTP层从登录态注入
}

message ApplyAdoptResponse {
    uint64 apply_id = 1;                  // 申请ID
    string status = 2;                    // 申请状态
    string message = 3;                   // 提示信息
    int32 applicant_credit_score = 4;     // 申请时的积分快照
}

message CancelAdoptApplyRequest {
    uint64 apply_id = 1;                  // 申请ID
    string reason = 2;                    // 取消原因

    uint64 applicant_id = 3;              // 当前用户ID，用于校验是否本人申请
}

message CancelAdoptApplyResponse {
    string message = 2;
}

message GetAdoptApplyDetailRequest {
    uint64 apply_id = 1;

    uint64 requester_id = 2;              // 当前查看人ID，用于权限校验
}

message AdoptApplicationVO {
    uint64 id = 1;
    uint64 cat_id = 2;
    string cat_name = 3;
    string cat_avatar = 4;
    uint64 applicant_id = 5;
    string applicant_name = 6;
    string apply_reason = 7;
    string contact_phone = 8;
    string contact_wechat = 9;
    int32 applicant_credit_score = 10;   // 申请时积分快照
    string status = 11;                   // pending/approved/rejected/cancelled/completed/expired
    string reject_reason = 12;
    uint64 reviewer_id = 13;
    string reviewer_name = 14;
    google.protobuf.Timestamp reviewed_at = 15;
    google.protobuf.Timestamp approved_at = 16;
    google.protobuf.Timestamp expires_at = 17;
    google.protobuf.Timestamp created_at = 18;
    google.protobuf.Timestamp updated_at = 19;
    uint64 adoption_id = 20;              // 关联的领养记录ID
}

message GetAdoptApplyDetailResponse {
    AdoptApplicationVO apply = 1;
    CatBriefVO cat = 2;
}

message ListMyAdoptAppliesRequest {
    string status = 1;                    // 可选：筛选状态
    int32 page = 2;
    int32 page_size = 3;

    uint64 applicant_id = 4;              // 当前登录用户ID
}

message ListMyAdoptionsRequest {
    uint64 user_id = 1;                   // 当前登录用户ID，作为 adopter_id 查询
    int32 page = 2;
    int32 page_size = 3;
}

message AdoptApplyItemVO {
    uint64 apply_id = 1;
    uint64 cat_id = 2;
    string cat_name = 3;
    string cat_avatar = 4;
    string cat_gender = 5;
    int32 credit_score_required = 6;      // 该猫所需积分
    string apply_reason = 7;
    string status = 8;
    string reject_reason = 9;
    google.protobuf.Timestamp created_at = 10;
    google.protobuf.Timestamp expires_at = 11;
}

message ListMyAdoptAppliesResponse {
    repeated AdoptApplyItemVO items = 1;
    int32 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// ==================== 管理员审核相关 ====================

message ApproveAdoptRequest {
    uint64 apply_id = 1;
    string note = 2;                      // 审核备注

    uint64 reviewer_id = 3;               // 审核人ID，当前管理员ID
}

message ApproveAdoptResponse {
    uint64 apply_id = 1;
    string status = 2;
    string message = 3;
    google.protobuf.Timestamp expires_at = 4;
}

// 拒绝申请
message RejectAdoptRequest {
    uint64 apply_id = 1;
    string reject_reason = 2;             // 必填

    uint64 reviewer_id = 3;               // 审核人ID，当前管理员ID
}

message RejectAdoptResponse {
    string message = 1;
}

message ListPendingAdoptAppliesRequest {
    uint64 cat_id = 1;                    // 可选：筛选某只猫的申请
    int32 page = 2;
    int32 page_size = 3;

    uint64 admin_id = 4;                  // 当前管理员ID，用于权限校验
}

message PendingApplyVO {
    uint64 apply_id = 1;
    uint64 cat_id = 2;
    string cat_name = 3;
    string cat_avatar = 4;
    string cat_gender = 5;
    int32 credit_score_required = 6;
    uint64 applicant_id = 7;
    string applicant_name = 8;
    string applicant_avatar = 9;
    int32 applicant_credit_score = 10;   // 申请时积分
    string apply_reason = 11;
    string contact_phone = 12;
    string contact_wechat = 13;
    google.protobuf.Timestamp created_at = 14;
}

message ListPendingAdoptAppliesResponse {
    repeated PendingApplyVO items = 1;
    int32 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// ==================== 领养记录相关 ====================

message CreateAdoptionRequest {
    uint64 apply_id = 1;                  // 来源申请ID
    string agreement_no = 2;              // 协议编号
    string note = 3;

    uint64 creator_id = 4;                // 创建人ID，通常是管理员ID
}

message CreateAdoptionResponse {
    uint64 adoption_id = 1;
    string message = 2;
}

// 直接领养（跳过申请流程）
message DirectAdoptRequest {
    uint64 cat_id = 1;
    uint64 adopter_id = 2;                // 领养人ID
    string agreement_no = 3;
    string note = 4;

    uint64 creator_id = 5;                // 操作管理员ID
}

message DirectAdoptResponse {
    uint64 adoption_id = 1;
    string message = 2;
}

// 获取领养详情
message GetAdoptionDetailRequest {
    uint64 adoption_id = 1;

    uint64 requester_id = 2;              // 当前查看人ID，用于判断是否本人/管理员
}

message AdoptionVO {
    uint64 id = 1;
    uint64 cat_id = 2;
    string cat_name = 3;
    string cat_avatar = 4;
    uint64 adopter_id = 5;
    string adopter_name = 6;
    string status = 7;                    // active/returned/expired
    string agreement_no = 8;
    google.protobuf.Timestamp agreed_at = 9;
    google.protobuf.Timestamp adopted_at = 10;

    // 家访信息
    google.protobuf.Timestamp home_visit_at = 11;
    uint64 home_visit_user_id = 12;
    string home_visit_remark = 13;

    // 回访信息
    google.protobuf.Timestamp visit_one_week_at = 14;
    google.protobuf.Timestamp visit_one_month_at = 15;
    google.protobuf.Timestamp visit_three_month_at = 16;
    google.protobuf.Timestamp visit_six_month_at = 17;

    // 退回信息
    bool is_returned = 18;
    string return_reason = 19;
    google.protobuf.Timestamp returned_at = 20;

    string note = 21;
    google.protobuf.Timestamp created_at = 22;
    google.protobuf.Timestamp updated_at = 23;
}

message GetAdoptionDetailResponse {
    AdoptionVO adoption = 1;
    CatBriefVO cat = 2;
    UserBriefVO adopter = 3;
}

// 领养记录列表
message ListAdoptionsRequest {
    uint64 adopter_id = 1;                // 按领养人筛选
    uint64 cat_id = 2;                    // 按猫咪筛选
    string status = 3;                    // active/returned/expired
    int32 page = 4;
    int32 page_size = 5;

    uint64 requester_id = 6;              // 当前查询人ID，通常是管理员ID
}

message AdoptionItemVO {
    uint64 adoption_id = 1;
    uint64 cat_id = 2;
    string cat_name = 3;
    string cat_avatar = 4;
    uint64 adopter_id = 5;
    string adopter_name = 6;
    string status = 7;
    string agreement_no = 8;
    google.protobuf.Timestamp adopted_at = 9;
    bool is_returned = 10;
}

message ListAdoptionsResponse {
    repeated AdoptionItemVO items = 1;
    int32 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// 更新领养信息
message UpdateAdoptionRequest {
    uint64 adoption_id = 1;
    string agreement_no = 2;
    string note = 3;

    uint64 operator_id = 4;               // 操作人ID
}

message UpdateAdoptionResponse {
    string message = 2;
}

// 记录家访
message RecordHomeVisitRequest {
    uint64 adoption_id = 1;
    string remark = 2;
    string photos = 3;                    // JSON数组

    uint64 visitor_id = 4;                // 家访志愿者/管理员ID
}

message RecordHomeVisitResponse {
    string message = 2;
}

// 记录回访
message RecordFollowUpVisitRequest {
    uint64 adoption_id = 1;
    int32 visit_type = 2;                 // 1=1周, 2=1月, 3=3月, 4=6月
    string remark = 3;
    string photos = 4;                    // JSON数组

    uint64 visitor_id = 5;                // 回访志愿者/管理员ID
}

message RecordFollowUpVisitResponse {
    string message = 2;
}

// 更新退回状态
message UpdateReturnStatusRequest {
    uint64 adoption_id = 1;
    bool returned = 2;
    uint64 returned_to_user_id = 3;       // 0表示退回平台
    string return_reason = 4;
    string photos = 5;
    google.protobuf.Timestamp returned_at = 6;

    uint64 operator_id = 7;               // 操作人ID，通常是管理员ID
}

message UpdateReturnStatusResponse {
    string message = 2;
}

// ==================== 通用 VO ====================

message CatBriefVO {
    uint64 id = 1;
    string name = 2;
    string avatar = 3;
    string gender = 4;
    int32 credit_score_required = 5;
}

message UserBriefVO {
    uint64 id = 1;
    string name = 2;
    string avatar = 3;
}


message ApplyUpdateCatInfoRequest {
    uint64 cat_id = 1;

    string name = 2;
    string gender = 3;
    string body_size = 4;
    string age_stage = 5;
    string description = 6;

    string discovery_address = 7;
    double longitude = 8;
    double latitude = 9;

    repeated string image_urls = 10;

    string change_reason = 11;
    uint64 applicant_user_id = 12;
}

message ApplyUpdateCatInfoResponse {
    uint64 apply_id = 1;
}

message GetMyUpdateCatApplyDetailRequest {
    uint64 apply_id = 1;
    uint64 user_id = 2;
}

message GetMyUpdateCatApplyDetailResponse {
    uint64 apply_id = 1;
    string status = 2;
    string reject_reason = 3;

    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp updated_at = 5;
}


/*
 * =========================================================
 * 志愿者侧 - 医疗记录
 * =========================================================
 */

message ApplyAddMedicalRecordRequest {
    uint64 cat_id = 1;

    string medical_type = 2; // vaccine/sterilization/check/treatment
    string content = 3;

    uint64 operator_id = 4;
}

message ApplyAddMedicalRecordResponse {
    uint64 record_apply_id = 1;
}


/*
 * =========================================================
 * 志愿者侧 - 救助记录
 * =========================================================
 */

message ApplyAddRescueRecordRequest {
    uint64 cat_id = 1;

    google.protobuf.Timestamp rescue_time = 2;
    string rescuer_name = 3;
    string rescue_status = 4;
    string description = 5;

    uint64 operator_id = 6;
}

message ApplyAddRescueRecordResponse {
    uint64 rescue_apply_id = 1;
}


/*
 * =========================================================
 * 志愿者侧 - 猫咪任务
 * =========================================================
 */

message ApplyCreateCatTaskRequest {
    uint64 cat_id = 1;

    string title = 2;
    string task_type = 3;
    string summary = 4;
    string detail = 5;

    google.protobuf.Timestamp deadline = 6;

    uint64 applicant_user_id = 7;
}

message ApplyCreateCatTaskResponse {
    uint64 apply_id = 1;
}

message ClaimCatTaskRequest {
    uint64 task_id = 1;
    uint64 user_id = 2;
}

message ClaimCatTaskResponse {
    bool success = 1;
}

message AbandonCatTaskRequest {
    uint64 task_id = 1;
    uint64 user_id = 2;
    string reason = 3;
}

message AbandonCatTaskResponse {
    bool success = 1;
}

message UploadTaskProgressRequest {
    uint64 task_id = 1;
    uint64 user_id = 2;

    string content = 3;
    repeated string image_urls = 4;
}

message UploadTaskProgressResponse {
    bool success = 1;
}

message CancelApplyCreateCatTaskRequest {
    uint64 apply_id = 1;
    uint64 user_id = 2;
    string reason = 3;
}

message GetMyTaskApplyDetailRequest {
    uint64 apply_id = 1;
    uint64 user_id = 2;
}

message GetMyTaskApplyDetailResponse {
    uint64 apply_id = 1;
    uint64 cat_id = 2;
    string cat_name = 3;
    string title = 4;
    string task_type = 5;
    string summary = 6;
    string detail = 7;
    google.protobuf.Timestamp deadline = 8;
    string status = 9;
    string reject_reason = 10;
    string urgency_level = 11;
    int32 difficulty_level = 12;
    int32 reward_points = 13;
    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp updated_at = 15;
}

message ListMyTaskAppliesRequest {
    uint64 user_id = 1;
    string status = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message TaskApplyItem {
    uint64 apply_id = 1;
    uint64 cat_id = 2;
    string cat_name = 3;
    string title = 4;
    string task_type = 5;
    string status = 6;
    google.protobuf.Timestamp created_at = 7;
}

message ListMyTaskAppliesResponse {
    repeated TaskApplyItem list = 1;
