Name: gateway
Host: 0.0.0.0
Port: 8080

# JWT
Auth:
  AccessSecret: "meow-nook-secret-change-in-production"
  AccessExpire: 86400   # 1 day in seconds

# Casbin policy files
Casbin:
  ModelPath:  "../../deploy/casbin/model.conf"
  PolicyPath: "../../deploy/casbin/policy.csv"

# Downstream gRPC services
UserRpc:
  Target: "127.0.0.1:9001"

CatRpc:
  Target: "127.0.0.1:9002"

TaskRpc:
  Target: "127.0.0.1:9003"

AdoptionRpc:
  Target: "127.0.0.1:9004"

PostRpc:
  Target: "127.0.0.1:9005"

# Logger
Log:
  Level:    "info"
  Encoding: "json"
