syntax = "proto3";

package post;

option go_package = "github.com/luyb177/meow-nook/service/post/pb/post";

// ──────────────────────────────────────────────
// Core models
// ──────────────────────────────────────────────

message PostInfo {
  int64           id          = 1;
  int64           author_id   = 2;
  string          author_name = 3;
  string          avatar      = 4;
  int64           cat_id      = 5;
  string          cat_name    = 6;
  string          content     = 7;
  repeated string images      = 8;
  int32           likes       = 9;
  int32           comments    = 10;
  int32           favorites   = 11;
  int64           created_at  = 12;
}

message CommentInfo {
  int64  id          = 1;
  int64  post_id     = 2;
  int64  author_id   = 3;
  string author_name = 4;
  string avatar      = 5;
  string content     = 6;
  int64  created_at  = 7;
}

// ──────────────────────────────────────────────
// Post RPCs
// ──────────────────────────────────────────────

message CreatePostReq {
  int64           author_id = 1;
  int64           cat_id    = 2;
  string          content   = 3;
  repeated string images    = 4;
}

message CreatePostResp {
  int64 post_id = 1;
}

message GetPostReq {
  int64 post_id = 1;
}

message GetPostResp {
  PostInfo post = 1;
}

message DeletePostReq {
  int64 post_id   = 1;
  int64 user_id   = 2;   // must match author or be admin
}

message DeletePostResp {}

message ListPostsReq {
  int64 cat_id    = 1;   // 0 = all
  int64 author_id = 2;   // 0 = all
  int32 page      = 3;
  int32 size      = 4;
}

message ListPostsResp {
  repeated PostInfo posts = 1;
  int64             total = 2;
}

// ──────────────────────────────────────────────
// Interactions
// ──────────────────────────────────────────────

message LikePostReq {
  int64 post_id = 1;
  int64 user_id = 2;
}

message LikePostResp {}

message UnlikePostReq {
  int64 post_id = 1;
  int64 user_id = 2;
}

message UnlikePostResp {}

message FavoritePostReq {
  int64 post_id = 1;
  int64 user_id = 2;
}

message FavoritePostResp {}

message UnfavoritePostReq {
  int64 post_id = 1;
  int64 user_id = 2;
}

message UnfavoritePostResp {}

// ──────────────────────────────────────────────
// Comments
// ──────────────────────────────────────────────

message AddCommentReq {
  int64  post_id   = 1;
  int64  author_id = 2;
  string content   = 3;
}

message AddCommentResp {
  int64 comment_id = 1;
}

message DeleteCommentReq {
  int64 comment_id = 1;
  int64 user_id    = 2;
}

message DeleteCommentResp {}

message ListCommentsReq {
  int64 post_id = 1;
  int32 page    = 2;
  int32 size    = 3;
}

message ListCommentsResp {
  repeated CommentInfo comments = 1;
  int64                total    = 2;
}

// ──────────────────────────────────────────────
// Reports
// ──────────────────────────────────────────────

message ReportPostReq {
  int64  post_id    = 1;
  int64  user_id    = 2;
  string reason     = 3;
}

message ReportPostResp {}

// ──────────────────────────────────────────────
// Service definition
// ──────────────────────────────────────────────

service PostService {
  rpc CreatePost(CreatePostReq)       returns (CreatePostResp);
  rpc GetPost(GetPostReq)             returns (GetPostResp);
  rpc DeletePost(DeletePostReq)       returns (DeletePostResp);
  rpc ListPosts(ListPostsReq)         returns (ListPostsResp);

  rpc LikePost(LikePostReq)           returns (LikePostResp);
  rpc UnlikePost(UnlikePostReq)       returns (UnlikePostResp);
  rpc FavoritePost(FavoritePostReq)   returns (FavoritePostResp);
  rpc UnfavoritePost(UnfavoritePostReq) returns (UnfavoritePostResp);

  rpc AddComment(AddCommentReq)       returns (AddCommentResp);
  rpc DeleteComment(DeleteCommentReq) returns (DeleteCommentResp);
  rpc ListComments(ListCommentsReq)   returns (ListCommentsResp);

  rpc ReportPost(ReportPostReq)       returns (ReportPostResp);
}
