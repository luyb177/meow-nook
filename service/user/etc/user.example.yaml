# Example configuration for the user RPC service.
# Copy to user.yaml and fill in real credentials before running.

Name: user.rpc
ListenOn: 0.0.0.0:9000
Mode: dev                   # dev | test | pro

Logger:
  Level: info
  OutputPath: stdout
  Service: user
  Env: dev
  InitialFields:
    app: meow-nook
    component: user-service

Kafka:
  Brokers:
    - 127.0.0.1:9092
  ServiceName: user.rpc
  GroupID: user-task-workers
  DefaultMaxRetry: 3
  BaseBackoff: 2s

# Redis is required for the delay queue (delayed retries).
# The service will panic at startup if Addr is empty or the connection fails.
Redis:
  Addr: 127.0.0.1:6379
  Password: ""
  DB: 0

Email:
  From: your-email@example.com
  Password: your-email-password
  SMTPHost: smtp.example.com
  SMTPPort: 465

MySQL:
  DSN: "user:password@tcp(127.0.0.1:3306)/meow_nook?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai&timeout=10s&readTimeout=30s&writeTimeout=30s"

JWT:
  Secret: "your-jwt-secret-change-in-production"
  ExpireTime: 336h   # 14 days

DLQEmail:
  To:
    - admin@example.com

# go-zero RPC server settings (etcd discovery).
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: user.rpc
