Name: user.rpc
ListenOn: 0.0.0.0:9001

Log:
  Level: info
  Encoding: json

DataSource:
  Host: 127.0.0.1
  Port: 5432
  User: postgres
  Password: postgres
  DBName: meow_nook
  SSLMode: disable

Redis:
  Host: 127.0.0.1:6379
  DB: 0

JWT:
  AccessSecret: "meow-nook-secret-change-in-production"
  AccessExpire: 86400 # 1 day in seconds

Email:
  From: "your-email@example.com"
  Password: "your-smtp-password"
  SMTPHost: "smtp.example.com"
  SMTPPort: 465

Kafka:
  Brokers:
    - "127.0.0.1:9092"
  ServiceName: "user"
  GroupID: "user-task-workers"
  DefaultMaxRetry: 3
  BaseBackoff: 2000000000  # 2s in nanoseconds

DLQEmail:
  From: "alert@example.com"
  Password: "your-smtp-password"
  SMTPHost: "smtp.example.com"
  SMTPPort: 465
  To:
    - "admin@example.com"
