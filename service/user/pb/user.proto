syntax = "proto3";

package user;

option go_package = "github.com/luyb177/meow-nook/service/user/pb/user";

// ──────────────────────────────────────────────
// Common structures
// ──────────────────────────────────────────────

message UserInfo {
  int64  id           = 1;
  string username     = 2;
  string avatar       = 3;
  string phone        = 4;
  string area         = 5;
  string gender       = 6;
  int32  points       = 7;
  string role         = 8;   // user / volunteer / admin
  int64  created_at   = 9;
}

// ──────────────────────────────────────────────
// Auth RPCs
// ──────────────────────────────────────────────

message RegisterReq {
  string username = 1;
  string password = 2;
  string phone    = 3;
}

message RegisterResp {
  int64  user_id = 1;
  string token   = 2;
}

message LoginReq {
  string username = 1;
  string password = 2;
}

message LoginResp {
  int64  user_id = 1;
  string token   = 2;
}

message LogoutReq {
  int64 user_id = 1;
}

message LogoutResp {}

// ──────────────────────────────────────────────
// Profile RPCs
// ──────────────────────────────────────────────

message GetUserInfoReq {
  int64 user_id = 1;
}

message GetUserInfoResp {
  UserInfo user = 1;
}

message UpdateUserInfoReq {
  int64  user_id  = 1;
  string username = 2;
  string avatar   = 3;
  string phone    = 4;
  string area     = 5;
  string gender   = 6;
  repeated string service_types = 7;
}

message UpdateUserInfoResp {}

message ChangePasswordReq {
  int64  user_id      = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResp {}

// ──────────────────────────────────────────────
// Points RPCs
// ──────────────────────────────────────────────

message GetPointsReq {
  int64 user_id = 1;
}

message GetPointsResp {
  int32 points = 1;
}

message AddPointsReq {
  int64  user_id  = 1;
  int32  delta    = 2;
  string reason   = 3;
  string task_id  = 4;
}

message AddPointsResp {
  int32 new_total = 1;
}

message ListPointLogsReq {
  int64 user_id = 1;
  int32 page    = 2;
  int32 size    = 3;
}

message PointLog {
  int64  id         = 1;
  int32  delta      = 2;
  string reason     = 3;
  string task_id    = 4;
  int32  balance    = 5;
  int64  created_at = 6;
}

message ListPointLogsResp {
  repeated PointLog logs  = 1;
  int64             total = 2;
}

// ──────────────────────────────────────────────
// Notification settings
// ──────────────────────────────────────────────

message NotificationSettings {
  bool task_notify       = 1;
  bool adoption_notify   = 2;
  bool points_notify     = 3;
  bool system_notify     = 4;
  bool message_notify    = 5;
}

message GetNotificationSettingsReq {
  int64 user_id = 1;
}

message GetNotificationSettingsResp {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsReq {
  int64                user_id  = 1;
  NotificationSettings settings = 2;
}

message UpdateNotificationSettingsResp {}

// ──────────────────────────────────────────────
// Feedback
// ──────────────────────────────────────────────

message SubmitFeedbackReq {
  int64  user_id       = 1;
  string feedback_type = 2;
  string content       = 3;
  string contact       = 4;
}

message SubmitFeedbackResp {
  int64 feedback_id = 1;
}

// ──────────────────────────────────────────────
// Service definition
// ──────────────────────────────────────────────

service UserService {
  // Auth
  rpc Register(RegisterReq)             returns (RegisterResp);
  rpc Login(LoginReq)                   returns (LoginResp);
  rpc Logout(LogoutReq)                 returns (LogoutResp);

  // Profile
  rpc GetUserInfo(GetUserInfoReq)       returns (GetUserInfoResp);
  rpc UpdateUserInfo(UpdateUserInfoReq) returns (UpdateUserInfoResp);
  rpc ChangePassword(ChangePasswordReq) returns (ChangePasswordResp);

  // Points
  rpc GetPoints(GetPointsReq)           returns (GetPointsResp);
  rpc AddPoints(AddPointsReq)           returns (AddPointsResp);
  rpc ListPointLogs(ListPointLogsReq)   returns (ListPointLogsResp);

  // Notifications
  rpc GetNotificationSettings(GetNotificationSettingsReq)       returns (GetNotificationSettingsResp);
  rpc UpdateNotificationSettings(UpdateNotificationSettingsReq) returns (UpdateNotificationSettingsResp);

  // Feedback
  rpc SubmitFeedback(SubmitFeedbackReq) returns (SubmitFeedbackResp);
}
