syntax = "proto3";

package user;

option go_package = "./pb/user/v1";

// ──────────────────────────────────────────────
// Common structures
// ──────────────────────────────────────────────

message UserInfo {
  int64  id           = 1;
  string username     = 2;
  string avatar       = 3;
  string phone        = 4;
  string area         = 5;
  string gender       = 6;
  int32  points       = 7;
  string role         = 8;   // user / volunteer / admin
  int64  created_at   = 9;
  repeated string service_types = 10;
}

// ──────────────────────────────────────────────
// Common Response
// ──────────────────────────────────────────────

message Response {

}


// ──────────────────────────────────────────────
// Auth RPCs
// ──────────────────────────────────────────────

enum VerifyChannel {
  VERIFY_CHANNEL_EMAIL   = 0;
  VERIFY_CHANNEL_PHONE   = 1;
}

enum VerifyPurpose {
  VERIFY_PURPOSE_LOGIN   = 0;
  VERIFY_PURPOSE_REGISTER = 1;
  VERIFY_PURPOSE_RESET_PASSWORD = 2;
}

message SendVerificationCodeReq {
  string target = 1;
  VerifyChannel channel = 2;
  VerifyPurpose purpose = 3;
}

message VerifyCodeReq {
  string target  = 1;
  VerifyChannel channel = 2;
  VerifyPurpose purpose = 3;
  string code    = 4;
}

message RegisterReq {
  string email    = 1;
  string password = 2;
}

message RegisterResp {
  int64  user_id = 1;
  string token   = 2;
}

message LoginReq {
  string email    = 1;
  string password = 2;
}

message LoginResp {
  int64  user_id = 1;
  string token   = 2;
}

message TestReq {}

message LogoutReq {
  int64 user_id = 1;
}

message LogoutResp {}

// ──────────────────────────────────────────────
// Profile RPCs
// ──────────────────────────────────────────────

message GetUserInfoReq {
  int64 user_id = 1;
}

message GetUserInfoResp {
  UserInfo user = 1;
}

message UpdateUserInfoReq {
  int64  user_id  = 1;
  string username = 2;
  string avatar   = 3;
  string phone    = 4;
  string area     = 5;
  string gender   = 6;
}

message UpdateUserInfoResp {}

message AdminUpdateServiceTypesReq {
  int64 user_id = 1;
  repeated string service_types = 2;
}

message AdminUpdateServiceTypesResp {}

message ChangePasswordReq {
  int64  user_id      = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResp {}

// ──────────────────────────────────────────────
// Points RPCs
// ──────────────────────────────────────────────

message GetPointsReq {
  int64 user_id = 1;
}

message GetPointsResp {
  int32 points = 1;
}

message AddPointsReq {
  int64  user_id  = 1;
  int32  delta    = 2;
  string reason   = 3;
  string task_id  = 4;
}

message AddPointsResp {
  int32 new_total = 1;
}

message ListPointLogsReq {
  int64 user_id = 1;
  int32 page    = 2;
  int32 size    = 3;
}

message PointLog {
  int64  id         = 1;
  int32  delta      = 2;
  string reason     = 3;
  string task_id    = 4;
  int32  balance    = 5;
  int64  created_at = 6;
}

message ListPointLogsResp {
  repeated PointLog logs  = 1;
  int64             total = 2;
}

message GetCreditPointsReq {
  int64 user_id = 1;
}

message GetCreditPointsResp {
  int32 credit_points = 1;
}

message DeductCreditForTaskViolationReq {
  int64 user_id = 1;
  string task_id = 2;
}

message DeductCreditForTaskViolationResp {
  int32 credit_points = 1;
}

message CheckCanTakeTaskReq {
  int64 user_id = 1;
}

message CheckCanTakeTaskResp {
  int32 credit_points = 1;
}

// ──────────────────────────────────────────────
// Notification settings
// ──────────────────────────────────────────────

message NotificationSettings {
  bool task_notify       = 1;
  bool adoption_notify   = 2;
  bool points_notify     = 3;
  bool system_notify     = 4;
  bool message_notify    = 5;
}

message GetNotificationSettingsReq {
  int64 user_id = 1;
}

message GetNotificationSettingsResp {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsReq {
  int64                user_id  = 1;
  NotificationSettings settings = 2;
}

message UpdateNotificationSettingsResp {}

// ──────────────────────────────────────────────
// Feedback
// ──────────────────────────────────────────────

message SubmitFeedbackReq {
  int64  user_id       = 1;
  string feedback_type = 2;
  string content       = 3;
  string contact       = 4;
}

message SubmitFeedbackResp {
  int64 feedback_id = 1;
}

// ──────────────────────────────────────────────
// Service definition
// ──────────────────────────────────────────────

service UserService {
  // Auth
  rpc Test(TestReq)                       returns (Response);
  rpc SendVerificationCode(SendVerificationCodeReq) returns (Response);
  rpc VerifyCode(VerifyCodeReq)           returns (Response);
  rpc Register(RegisterReq)              returns (RegisterResp);
  rpc Login(LoginReq)                    returns (LoginResp);
  rpc Logout(LogoutReq)                  returns (LogoutResp);

  // Profile
  rpc GetUserInfo(GetUserInfoReq)        returns (GetUserInfoResp);
  rpc UpdateUserInfo(UpdateUserInfoReq)  returns (UpdateUserInfoResp);

  // Admin
  rpc AdminUpdateServiceTypes(AdminUpdateServiceTypesReq) returns (AdminUpdateServiceTypesResp);

  // Credit
  rpc GetCreditPoints(GetCreditPointsReq) returns (GetCreditPointsResp);
  rpc DeductCreditForTaskViolation(DeductCreditForTaskViolationReq) returns (DeductCreditForTaskViolationResp);
  rpc CheckCanTakeTask(CheckCanTakeTaskReq) returns (CheckCanTakeTaskResp);
}
